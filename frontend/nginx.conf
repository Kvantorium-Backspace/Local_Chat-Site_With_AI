server {
    listen 80;

    # Раздаём React-приложение
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Нужно для React Router — все пути отдают index.html
        try_files $uri $uri/ /index.html;
    }

    # Проксируем запросы к Ollama
    # Фронт обращается на /ollama/... → nginx перенаправляет в контейнер ollama
    location /ollama/ {
        proxy_pass http://ollama:11434/;
        proxy_set_header Host $host;
    }
}